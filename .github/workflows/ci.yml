name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop web client
        working-directory: desktop
        run: npm run build

      - name: Common pure logic checks
        working-directory: common
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Crypto self-check
        working-directory: mobile
        run: npm run test:crypto

      - name: Realtime lifecycle check
        working-directory: mobile
        run: npm run test:realtime

      - name: Android Metro bundle
        working-directory: mobile
        run: |
          out_dir="$(mktemp -d)"
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output "$out_dir/index.android.bundle" \
            --assets-dest "$out_dir/assets"

      - name: Validate native dependency graph
        working-directory: mobile
        run: npx react-native config

  extension:
    name: VS Code extension checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Test extension
        working-directory: vscode-extension
        run: npm test

      - name: Package extension
        working-directory: vscode-extension
        run: npm run package -- --out "$RUNNER_TEMP/react-component-preview.vsix"

      - name: Verify portable VSIX
        run: |
          unzip -l "$RUNNER_TEMP/react-component-preview.vsix" > "$RUNNER_TEMP/vsix-contents.txt"
          ! grep -E '(@esbuild/|esbuild\.(exe|dll|dylib))' "$RUNNER_TEMP/vsix-contents.txt"
          grep -F 'extension/node_modules/esbuild-wasm/esbuild.wasm' "$RUNNER_TEMP/vsix-contents.txt"

  server:
    name: Server Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Test server
        run: cargo test --manifest-path server/Cargo.toml

      - name: Build server image
        run: docker build --build-arg APP_VERSION=0.2.3 --tag enter-server:ci --file server/Dockerfile .
