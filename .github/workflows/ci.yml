name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop web client
        working-directory: desktop
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Crypto self-check
        working-directory: mobile
        run: npm run test:crypto

      - name: Export web bundle
        working-directory: mobile
        run: npx expo export --platform web
