name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare desktop draft release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate release token
        shell: bash
        run: test -n "$GH_TOKEN" || { echo "RELEASE_TOKEN is required"; exit 1; }

      - name: Create or update desktop draft release
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="desktop-v$version"
          title="Enter Desktop v$version"
          notes="Desktop bundles built from the committed desktop version."
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' | \
            awk -F '\t' -v tag="$tag" '$2 == tag {print $1; exit}')"

          if [[ -n "$release_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f "name=$title" \
              -f "body=$notes" \
              -F draft=true \
              -F prerelease=false
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=$tag" \
              -f "target_commitish=$GITHUB_SHA" \
              -f "name=$title" \
              -f "body=$notes" \
              -F draft=true \
              -F prerelease=false
          fi

  release:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: ''
            args: ''
          - name: Windows x64
            os: windows-latest
            target: ''
            args: ''
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Enter Desktop v__VERSION__
          releaseBody: Built from the committed desktop version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    name: Keep desktop draft release
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Keep release as draft
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="desktop-v$version"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' | \
            awk -F '\t' -v tag="$tag" '$2 == tag {print $1; exit}')"
          test -n "$release_id" || { echo "Release $tag was not found"; exit 1; }
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=true \
            -F prerelease=false >/dev/null
