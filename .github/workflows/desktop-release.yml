name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: ''
            args: ''
          - name: Windows x64
            os: windows-latest
            target: ''
            args: ''
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Enter Desktop v__VERSION__
          releaseBody: Built from the committed desktop version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
