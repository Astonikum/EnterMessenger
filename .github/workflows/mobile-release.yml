name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, both]
        default: android
        required: true
      artifact:
        description: Android artifact type (ignored for iOS)
        type: choice
        options: [apk, aab]
        default: apk
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Android ${{ inputs.artifact }}
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Crypto self-check
        run: npm run test:crypto

      - name: Read mobile version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./app.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "${{ inputs.artifact }}" == "aab" && -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "AAB release requires ANDROID_KEYSTORE_BASE64 and Android signing secrets."
            exit 1
          fi
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is required"; exit 1; }
            test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required"; exit 1; }
            test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required"; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/enter-release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/enter-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Android artifact
        working-directory: mobile/android
        shell: bash
        run: |
          if [[ "${{ inputs.artifact }}" == "aab" ]]; then
            ./gradlew --no-daemon bundleRelease
            source_path="app/build/outputs/bundle/release/app-release.aab"
          else
            ./gradlew --no-daemon assembleRelease
            source_path="app/build/outputs/apk/release/app-release.apk"
          fi
          cp "$source_path" "$RUNNER_TEMP/Enter-Mobile-v${{ steps.version.outputs.version }}-${{ inputs.artifact }}.${{ inputs.artifact }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Enter-Mobile-v${{ steps.version.outputs.version }}-android-${{ inputs.artifact }}
          path: ${{ runner.temp }}/Enter-Mobile-v${{ steps.version.outputs.version }}-${{ inputs.artifact }}.${{ inputs.artifact }}
          if-no-files-found: error

  ios:
    name: iOS simulator build
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Typecheck
        run: npm run typecheck

      - name: Read mobile version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./app.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build iOS simulator app
        shell: bash
        run: |
          derived_data="$RUNNER_TEMP/enter-ios-derived-data"
          xcodebuild \
            -workspace ios/EnterMobile.xcworkspace \
            -scheme EnterMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            "$derived_data/Build/Products/Debug-iphonesimulator/EnterMobile.app" \
            "$RUNNER_TEMP/Enter-Mobile-v${{ steps.version.outputs.version }}-ios-simulator.app.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Enter-Mobile-v${{ steps.version.outputs.version }}-ios-simulator
          path: ${{ runner.temp }}/Enter-Mobile-v${{ steps.version.outputs.version }}-ios-simulator.app.zip
          if-no-files-found: error

  release:
    name: Create mobile draft release
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Read mobile version
        id: version
        run: |
          version="$(node -p "require('./mobile/app.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$version" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Enter-Mobile-*
          path: artifacts
          merge-multiple: true

      - name: Create or update mobile draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="Enter Mobile v${{ steps.version.outputs.version }}"
          notes="Native React Native mobile artifacts built with Gradle and Xcode."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --draft
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --draft
          fi
          for artifact in artifacts/*; do
            gh release upload "$tag" "$artifact" --clobber
          done
          release_url="$(gh release view "$tag" --json url --jq .url)"
          echo "Draft release: $release_url" >> "$GITHUB_STEP_SUMMARY"
