name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android]
        default: android
        required: true
      submit:
        description: Submit the completed build to the stores
        type: boolean
        default: false
        required: true
      profile:
        description: EAS build profile (preview creates an installable APK)
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: write

jobs:
  release:
    name: EAS ${{ inputs.platform }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Expo/EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate release secrets
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is required"; exit 1; }

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Crypto self-check
        run: npm run test:crypto

      - name: Read mobile version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Android artifact
        id: artifact
        run: |
          profile="${{ inputs.profile }}"
          if [[ "${{ inputs.submit }}" == "true" ]]; then
            profile=production
          fi

          eas build \
            --platform "${{ inputs.platform }}" \
            --profile "$profile" \
            --non-interactive \
            --wait \
            --json > build.json

          if [[ "${{ inputs.submit }}" == "true" ]]; then
            eas submit --platform android --profile production --latest --non-interactive
          fi

          artifact_url="$(node -e 'const fs=require("fs"); const builds=JSON.parse(fs.readFileSync("build.json", "utf8")); const url=builds[0]?.artifacts?.applicationArchiveUrl; if (!url) process.exit(1); process.stdout.write(url);')"
          extension=apk
          if [[ "$profile" == "production" ]]; then
            extension=aab
          fi
          artifact_name="Enter-Mobile-v${{ steps.version.outputs.version }}.${extension}"
          mkdir -p release
          curl --fail --location --retry 3 "$artifact_url" --output "release/$artifact_name"
          rm -f build.json
          echo "path=release/$artifact_name" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: Enter-Mobile-v${{ steps.version.outputs.version }}-${{ steps.artifact.outputs.profile }}
          path: mobile/${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Add mobile artifact summary
        run: |
          echo "### Mobile artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded Enter-Mobile-v${{ steps.version.outputs.version }}-${{ steps.artifact.outputs.profile }}." >> "$GITHUB_STEP_SUMMARY"
