name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android]
        default: android
        required: true
      submit:
        description: Submit the completed build to the stores
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  release:
    name: EAS ${{ inputs.platform }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Expo/EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate release secrets
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is required"; exit 1; }

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Crypto self-check
        run: npm run test:crypto

      - name: Build without submitting
        if: ${{ !inputs.submit }}
        run: eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --no-wait

      - name: Build and submit
        if: ${{ inputs.submit }}
        run: |
          eas build --platform android --profile production --non-interactive
          eas submit --platform android --profile production --latest --non-interactive
